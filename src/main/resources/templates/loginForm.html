<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Iniciar sesión')"></head>
<body>
<nav th:replace="base :: navbar"></nav>

<div class="container mt-5" style="max-width: 400px">
    <h3 class="text-center mb-4">Ingrese sus datos</h3>

    <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos</div>

    <form th:action="@{/processlogin}" method="post">
        <div class="form-group">
            <label for="username">Correo</label>
            <input type="email" class="form-control" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-info btn-block">Iniciar sesión</button>
    </form>
</div>
</body>
</html>
