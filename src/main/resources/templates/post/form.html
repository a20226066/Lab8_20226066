<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Post')"></head>
<body>
<nav th:replace="base :: navbar"></nav>

<div class="container mt-4">
    <h3 th:text="${post.id_Post == 0} ? 'Nuevo post' : 'Editar post'">Nuevo/Editar</h3>
    <hr/>
    <form method="post" th:action="@{/post/guardar}" th:object="${post}">
        <input type="hidden" th:field="*{id_Post}"/>

        <div class="form-group">
            <label for="title">Título</label>
            <input type="text" class="form-control" th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>
        <div class="form-group">
            <label for="summary">Resumen</label>
            <input type="text" class="form-control" th:field="*{summary}"
                   th:classappend="${#fields.hasErrors('summary')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{summary}"></div>
        </div>
        <div class="form-group">
            <label for="content">Contenido</label>
            <textarea class="form-control" rows="6" th:field="*{content}"></textarea>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" th:field="*{published}">
            <label class="form-check-label" for="published1">Publicado</label>
        </div>

        <a th:href="@{/post}" class="btn btn-danger">Cancelar</a>
        <button type="submit" class="btn btn-primary"
                th:text="${post.id_Post == 0} ? 'Registrar' : 'Actualizar'">Guardar</button>
    </form>
</div>
</body>
</html>
